    query: {metric: obligations, filters: [{field: recipient, op: eq, value: "Z4XGALW7L9K6"}], time_range: {start: "2024-10-01", end: "2025-09-30"}}
    known_difference: >-
      Recipient level differs: the catalog's recipient dimension is the reporting (parent)
      UEI, and the transactions of recipient Z4XGALW7L9K6 roll up to four parents
      (ML53DYBW2523, RBRXSHXKFCB5, Z4XGALW7L9K6, XA9SVRU7K217), so the query gives
      -923852.08 for the six transactions whose parent is Z4XGALW7L9K6, not the
      84868589.24 the publisher gives for the recipient's own UEI.
  - id: obligations.recipient.DK4TBEJRAR56
    query: {metric: obligations, filters: [{field: recipient, op: eq, value: "DK4TBEJRAR56"}], time_range: {start: "2024-10-01", end: "2025-09-30"}}

