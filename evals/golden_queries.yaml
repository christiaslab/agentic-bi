  # owner_api: the publisher's top five recipients. The catalog's recipient dimension is the
  # reporting (parent) UEI; the publisher ranks recipients by their own UEI.
  - id: obligations.recipient.DBD6KDKXWN65
    query: {metric: obligations, filters: [{field: recipient, op: eq, value: "DBD6KDKXWN65"}], time_range: {start: "2024-10-01", end: "2025-09-30"}}
  - id: obligations.recipient.VHPJR3MJWV49
    query: {metric: obligations, filters: [{field: recipient, op: eq, value: "VHPJR3MJWV49"}], time_range: {start: "2024-10-01", end: "2025-09-30"}}
  - id: obligations.recipient.MHMPN3F73NX3
    query: {metric: obligations, filters: [{field: recipient, op: eq, value: "MHMPN3F73NX3"}], time_range: {start: "2024-10-01", end: "2025-09-30"}}
