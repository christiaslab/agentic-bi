  # derived: computed from the snapshot by the SQL stored with each golden value
  - id: awards.active_in_period.count
    query: {metric: award_count, time_range: {start: "2024-10-01", end: "2025-09-30"}}
  - id: awards.net_negative.count
    not_expressible: >-
      Counting awards by the sign of their net obligation needs a per-award sum and a
      condition on it; no metric kind does that.
    disposition: candidate_catalog_change
    attempt:
      query: {metric: net_negative_award_count, time_range: {start: "2024-10-01", end: "2025-09-30"}}
      refusal: unknown_metric
  - id: obligations.deobligations.sum
    not_expressible: >-
      The catalog sums obligations net only; no metric or filter selects the negative
      transaction amounts.
    disposition: candidate_catalog_change
    attempt:
      query: {metric: deobligations, time_range: {start: "2024-10-01", end: "2025-09-30"}}
      refusal: unknown_metric
  - id: awards.average_net_obligation
    query: {metric: avg_award_value, time_range: {start: "2024-10-01", end: "2025-09-30"}}
  - id: recipients.top10_reporting_share
    query: {metric: supplier_concentration_top10, time_range: {start: "2024-10-01", end: "2025-09-30"}}
  - id: award.most_negative.net_obligation
    not_expressible: >-
      Finding the award with the lowest net obligation needs an award dimension and an
      order with a limit; the ADR-0002 query has neither, and awards are not a catalog
      dimension.
    disposition: out_of_scope_by_design
    attempt:
      query: {metric: obligations, dimensions: [award], time_range: {start: "2024-10-01", end: "2025-09-30"}}
      refusal: unknown_dimension

