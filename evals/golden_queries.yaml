# Golden reproduction: every value of docs/golden/golden.json mapped to one structured query
# (the S3a schema, docs/catalog.md), or to the reason the catalog cannot express it.
#
# Read by agentic_bi.reproduce (docs/reproduction.md). Every golden id appears exactly once.
# An entry holds either
#   query:            the structured query, compiled and run as an agent's query would be;
#   row:              for a grouped query, the output columns and values that select the one
#                     row the golden value describes; absent when the query returns one row;
#   known_difference: set only after a run showed a difference; the value stays failing and
#                     the test marks it xfail with this reason (it is never remapped to pass);
# or
#   not_expressible:  one line, why no catalog query gives this value;
#   disposition:      candidate_catalog_change or out_of_scope_by_design;
#   attempt:          the nearest structured query and the refusal code the compiler gives it.
# A note explains a mapping choice; it changes nothing.
#
# Every query carries the fiscal year of the slice as its time range, as a question about
# fiscal year 2025 would.

version: 1
golden_capture_date: "2026-11-01"

values:
  # owner_api: the slice totals
  - id: transactions.count
    not_expressible: >-
      The catalog counts awards, not transactions; no metric counts transaction rows.
    disposition: candidate_catalog_change
    attempt:
      query: {metric: transaction_count, time_range: {start: "2024-10-01", end: "2025-09-30"}}
      refusal: unknown_metric
  - id: obligations.total
    query: {metric: obligations, time_range: {start: "2024-10-01", end: "2025-09-30"}}

