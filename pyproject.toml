[project]
name = "agentic-bi"
version = "0.1.0"
description = "An analyst agent over US federal contract spending: structured queries, a compiler over a metrics catalog, and evals against the publisher's totals."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic==2.3.0",
    "duckdb==1.5.6",
    "pyyaml==6.0.3",
    "sqlmesh==0.236.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_bi"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/commit_hygiene.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
